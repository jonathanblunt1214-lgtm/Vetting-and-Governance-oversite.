name: Independent Crucible oversight

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: independent-crucible-oversight
  cancel-in-progress: false

jobs:
  oversight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: jonathanblunt1214-lgtm/The-Crucible
          ref: development
          path: target
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Resolve exact Crucible commit
        id: target
        working-directory: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test the independent verifier
        run: node --test oversight/verify.test.mjs
      - name: Vet data and audit Crucible independently
        run: node oversight/verify.mjs target inbox "${{ steps.target.outputs.sha }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: independent-oversight-${{ steps.target.outputs.sha }}
          path: oversight-report.json
          if-no-files-found: error
          retention-days: 90
